<style>
/* Bold the site owner's name wherever it appears in author lists */
a[href*="/author/me/"],
a[href*="/authors/me/"],
.author-link[data-author="me"],
[data-author-slug="me"] {
  font-weight: 700;
}

/* Hide reading-time indicator on publication and event cards */
.reading-time,
[data-component="reading-time"],
.read-time,
.post-reading-time {
  display: none !important;
}

/* ---- Restrained, academic-style headings ---------------------------- */
/* Refined serif stack — feels closer to a journal page than a marketing
   site — with a modest weight, slightly tighter tracking, and smaller
   sizes than the theme defaults. */
h1, h2, h3, h4 {
  font-family: 'Charter', 'Iowan Old Style', 'Source Serif Pro',
               'Source Serif 4', 'Lora', Georgia, 'Times New Roman',
               serif;
  font-weight: 500;
  letter-spacing: -0.015em;
  font-feature-settings: 'kern' 1, 'liga' 1;
}

/* Soften the giant page-level headlines the theme ships with.
   Override the Tailwind utility classes the theme set on h1/h2 so the
   refined serif + lighter weight wins. */
h1.text-4xl,
h1.text-3xl,
h1.lg\:text-6xl,
.text-4xl.font-bold,
.text-3xl.font-bold {
  font-size: 1.75rem;         /* ~28px instead of 30–36px */
  line-height: 1.2;
  font-weight: 500;
}

/* Section headers (block titles like "Recent Publications", "Highlighted
   Talks", "Selected Awards") feel less shouty. */
.bbloxh2,
h2.text-3xl,
h2.text-2xl,
h2.text-xl {
  font-size: 1.4rem;          /* ~22px */
  line-height: 1.25;
  font-weight: 500;
}

/* Sub-section headings (e.g. block titles in Experience). */
h3.text-xl,
h3.text-2xl {
  font-size: 1.1rem;
  line-height: 1.3;
  font-weight: 500;
}

/* Hugo Blox block titles often live in <h2 class="..."> wrappers from
   the markdown block component — catch those too. */
.bbloxh1, .bbloxh2, .bbloxh3 {
  font-family: 'Charter', 'Iowan Old Style', 'Source Serif Pro',
               'Source Serif 4', 'Lora', Georgia, 'Times New Roman',
               serif;
  font-weight: 500;
  letter-spacing: -0.015em;
}

/* ---- Resume biography (home page hero) refinements ----------------- */
/* Role line under the name ("Researcher") — was a chunky 2xl/600.
   Drop to a calm subtitle weight, keep the accent colour. */
.resume-biography p.text-2xl.font-semibold.text-primary-600,
.resume-biography .text-2xl.font-semibold.text-primary-600 {
  font-size: 1.1rem;
  font-weight: 500;
  letter-spacing: 0;
  font-family: inherit;
}

/* Download CV button — was a giant gradient pill (px-8 py-4 / font-bold
   text-lg / rounded-xl / shadow-lg / hover:scale-105). Trim it down. */
.resume-biography a.inline-flex.bg-gradient-to-r {
  padding: 0.55rem 1.1rem !important;
  font-size: 0.9rem !important;
  font-weight: 500 !important;
  border-radius: 0.5rem !important;
  box-shadow: none !important;
  transform: none !important;
}
.resume-biography a.inline-flex.bg-gradient-to-r:hover {
  transform: none !important;
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.08) !important;
}
.resume-biography a.inline-flex.bg-gradient-to-r svg {
  width: 1rem !important;
  height: 1rem !important;
  margin-right: 0.5rem !important;
}

/* Education degree titles (PhD / MEng / MSc / BSc) — were text-xl
   font-bold. Quieter, sentence-weight. */
.resume-biography p.text-xl.font-bold {
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: -0.005em;
  font-family: inherit;
}

/* Education cards: soften the gradient backdrops + rings so the
   degrees read as a clean list rather than three coloured tiles. */
.resume-biography .group.bg-gradient-to-br {
  background: transparent !important;
  box-shadow: none !important;
  border: 1px solid rgb(226 232 240 / 0.7) !important;
  border-radius: 0.5rem !important;
}
.dark .resume-biography .group.bg-gradient-to-br {
  border-color: rgb(51 65 85 / 0.5) !important;
}
.resume-biography .group.bg-gradient-to-br:hover {
  border-color: rgb(203 213 225) !important;
  transform: none !important;
}
.dark .resume-biography .group.bg-gradient-to-br:hover {
  border-color: rgb(71 85 105) !important;
}
/* Drop the round avatar/icon disc next to each degree — visual noise. */
.resume-biography .group.bg-gradient-to-br .w-12.h-12.bg-white {
  display: none !important;
}

/* ---- Awards blocks (home Selected + full /awards/ page) ------------
   Markdown blocks wrap content in max-w-prose, which is narrower than
   the Highlighted Talks collection block. Let the inner list breathe
   so the two sections sit on the same width. */
#awards .max-w-prose,
#awards-full .max-w-prose {
  max-width: none !important;
}
#awards .prose,
#awards-full .prose {
  max-width: none !important;
}
#awards .container.max-w-3xl,
#awards-full .container.max-w-3xl {
  max-width: 48rem;   /* same target as talks list */
}
</style>
