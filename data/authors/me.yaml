bio: |
  Samuel Ruipérez-Campillo is an engineer and PhD candidate in Computer Science
  at the Institute of Machine Learning, ETH Zurich, where his research focuses
  on machine learning for cardiology. He is currently a visiting research fellow
  at MIT's Institute for Medical Engineering and Science and Harvard Medical
  School. Previously, he completed an MSc at ETH Zurich and an MEng at UC
  Berkeley, worked at Stanford under Prof. Sanjiv Narayan, joined PhysCade Inc.,
  a Stanford spin-off developing AI for electrophysiology, as its third
  employee, and founded Swiift, a Berkeley SkyDeck startup. His studies have
  been fully funded by several competitive fellowships, including the "la Caixa"
  Fellowship, the Rafael del Pino Fellowship, and the UC Berkeley Fung Institute
  Fellowship.

